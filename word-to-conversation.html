<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>단어에서 대화까지 · 엄마영어</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;background:#f7f5ef;color:#292924}body{margin:0}.wrap{max-width:650px;margin:auto;padding:24px 18px 90px}a{color:inherit}h1{font-size:27px;margin:10px 0}p{line-height:1.6}.muted{color:#706d66}.card{background:white;border:1px solid #e8e3da;border-radius:20px;padding:20px;margin:16px 0;box-shadow:0 2px 8px #00000006}button,select{font:inherit;border:1px solid #d9d4ca;background:white;border-radius:13px;padding:12px;cursor:pointer}button:focus-visible{outline:3px solid #8cb8ac}button.active,.primary{background:#346f63;color:white;border-color:#346f63}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{flex:1}.english{font-size:25px;font-weight:750;line-height:1.35}.ko{color:#5e5b54}.small{font-size:14px}.stack{display:grid;gap:9px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pill{background:#f0eee8;border-radius:12px;padding:8px 11px}.hidden{display:none}label{font-weight:650}select{width:100%;margin:8px 0}.feedback{min-height:22px;font-weight:650}</style></head><body><main class="wrap"><a href="./">← 엄마영어 홈</a><h1>단어에서 대화까지</h1><p class="muted">하나의 단어로 문장, 대화, 문법까지 연습해요. 기존 공부 기록은 건드리지 않아요.</p><label for="scene">오늘의 장소</label><select id="scene"><option value="pool">🏊 수영장</option><option value="pingpong">🏓 탁구장</option><option value="market">🛒 시장</option></select><div class="card"><div class="row"><span class="pill" id="count"></span><button id="next">다음 단어 →</button></div><h2 id="word" class="english"></h2><p id="meaning" class="ko"></p><div class="tabs"><button data-tab="sentence" class="active">문장</button><button data-tab="talk">대화</button><button data-tab="grammar">문법</button></div><div id="lesson" style="margin-top:20px"></div><div class="row"><button id="listen">🔊 영어 듣기</button><button id="toggle">뜻 가리기</button><button id="favorite">☆ 표현 저장</button></div></div><div class="card"><h2>기억해 볼까?</h2><p id="question"></p><div class="stack" id="choices"></div><p id="feedback" class="feedback" aria-live="polite"></p></div><p class="muted small">소리는 기기에 설치된 영어 음성을 사용해요. 저장한 표현은 이 기기의 브라우저에 보관돼요.</p></main><script>
const lessons={
pool:[{word:"swim",ko:"수영하다",sentence:"I swim every morning.",translation:"저는 매일 아침 수영해요.",talk:["Can you swim?","Yes, I can."],talkKo:["수영할 수 있어요?","네, 할 수 있어요."],grammar:"can 다음에는 동사원형 swim을 써요. I can swim. (O)",quiz:"수영할 수 있어요?",options:["Can you swim?","Can you swimming?","Are you swim?"],correct:0},{word:"lane",ko:"수영 레인",sentence:"Is this lane for beginners?",translation:"이 레인은 초보자용인가요?",talk:["Is this lane for beginners?","Yes, it is."],talkKo:["이 레인은 초보자용인가요?","네, 맞아요."],grammar:"Is this ...? 로 가까이 있는 것을 가리켜 물어볼 수 있어요.",quiz:"이 레인은 초보자용인가요?",options:["Is this lane for beginners?","Are this lane beginners?","Does this lane beginner?"],correct:0},{word:"cap",ko:"수영모, 모자",sentence:"Do I have to wear a swim cap?",translation:"수영모를 꼭 써야 하나요?",talk:["Do I have to wear a swim cap?","Yes, you do."],talkKo:["수영모를 꼭 써야 하나요?","네, 써야 해요."],grammar:"have to + 동사원형은 '~해야 한다'는 뜻이에요.",quiz:"수영모를 꼭 써야 하나요?",options:["Do I have to wear a swim cap?","Do I have wear swim cap?","Am I have to cap?"],correct:0}],
pingpong:[{word:"serve",ko:"서브하다",sentence:"It's my turn to serve.",translation:"제가 서브할 차례예요.",talk:["Whose turn is it to serve?","It's my turn."],talkKo:["누가 서브할 차례예요?","제 차례예요."],grammar:"It's my turn to + 동사원형은 '내가 ~할 차례'라는 표현이에요.",quiz:"제가 서브할 차례예요.",options:["It's my turn to serve.","It's my turn serving.","I turn to serve."],correct:0},{word:"game",ko:"경기, 게임",sentence:"Would you like to play a game?",translation:"한 게임 하실래요?",talk:["Would you like to play a game?","Sure, let's play."],talkKo:["한 게임 하실래요?","좋아요, 해요."],grammar:"Would you like to + 동사원형은 공손하게 권할 때 써요.",quiz:"한 게임 하실래요?",options:["Would you like to play a game?","Would you like play a game?","Are you like to game?"],correct:0}],
market:[{word:"buy",ko:"사다",sentence:"I'd like to buy some apples.",translation:"사과를 좀 사고 싶어요.",talk:["I'd like to buy some apples.","How many would you like?"],talkKo:["사과를 좀 사고 싶어요.","몇 개 드릴까요?"],grammar:"I'd like to + 동사원형은 원하는 일을 공손하게 말할 때 써요.",quiz:"사과를 좀 사고 싶어요.",options:["I'd like to buy some apples.","I'd like buying some apples.","I like to buying apples."],correct:0},{word:"price",ko:"가격",sentence:"What's the price per kilogram?",translation:"1킬로그램에 얼마예요?",talk:["What's the price per kilogram?","It's five dollars."],talkKo:["1킬로그램에 얼마예요?","5달러예요."],grammar:"per는 '~당'이라는 뜻이에요. per kilogram = 1킬로그램당.",quiz:"1킬로그램에 얼마예요?",options:["What's the price per kilogram?","What price a kilogram is?","How price kilogram?"],correct:0}]};
const $=id=>document.getElementById(id);let scene="pool",idx=0,tab="sentence",show=true;const key="mom-english:extended-favorites";let saved=[];try{saved=JSON.parse(localStorage.getItem(key))||[]}catch{}
const current=()=>lessons[scene][idx];function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){const x=current();$("count").textContent=(idx+1)+" / "+lessons[scene].length;$("word").textContent=x.word;$("meaning").textContent=x.ko;document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));const en=tab==="sentence"?x.sentence:tab==="talk"?x.talk.join(" / "):x.sentence;const ko=tab==="sentence"?x.translation:tab==="talk"?x.talkKo.join(" / "):x.grammar;$("lesson").innerHTML='<p class="english" lang="en">'+esc(en)+'</p><p class="ko '+(show?'':'hidden')+'">'+esc(ko)+'</p>';$("toggle").textContent=show?"뜻 가리기":"뜻 보기";$("favorite").textContent=saved.includes(scene+":"+x.word)?"★ 저장됨":"☆ 표현 저장";$("question").textContent=x.quiz;const opts=x.options.map((s,i)=>({s,i})).sort(()=>Math.random()-.5);$("choices").innerHTML=opts.map(o=>'<button data-answer="'+o.i+'">'+esc(o.s)+'</button>').join("");$("feedback").textContent=""}
function speak(){const x=current();let s=tab==="talk"?x.talk.join(". "):x.sentence;if(!("speechSynthesis"in window)){$("feedback").textContent="이 기기는 음성 재생을 지원하지 않아요.";return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang="en-US";u.rate=.8;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang==="en-US")||voices.find(v=>v.lang.startsWith("en"))||null;speechSynthesis.speak(u)}
$("scene").onchange=e=>{scene=e.target.value;idx=0;render()};$("next").onclick=()=>{idx=(idx+1)%lessons[scene].length;render()};document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$("listen").onclick=speak;$("toggle").onclick=()=>{show=!show;render()};$("favorite").onclick=()=>{const id=scene+":"+current().word;saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];try{localStorage.setItem(key,JSON.stringify(saved))}catch{}render()};$("choices").onclick=e=>{const b=e.target.closest("[data-answer]");if(!b)return;const ok=Number(b.dataset.answer)===current().correct;$("feedback").textContent=ok?"정답이에요! ⭐":"다시 해볼까요? 정답: "+current().options[current().correct]};render();
</script></body></html>
